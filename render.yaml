services:
  - type: web
    name: traceit-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: traceit-web
    runtime: static
    rootDir: frontend
    staticPublishPath: .
