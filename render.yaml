services:
  - type: web
    name: traceit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_HOURS
        value: "72"
      - key: ENVIRONMENT
        value: production
  - type: web
    name: traceit
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
